site_name: FullStaQD Architecture Documentation
theme:
  name: material
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: lucide/sun
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: lucide/moon
        name: Switch to system preference
  logo: images/fullstaqd-logo-square.png
  favicon: images/fullstaqd-logo-square.png
  features:
    - content.action.edit
    - content.action.view
    - navigation.tabs
markdown_extensions: 
  - attr_list
  - md_in_html # for using markdown in <figure>s

  # for adminitions, source:
  # https://squidfunk.github.io/mkdocs-material/reference/admonitions/
  - admonition
  - pymdownx.details
  - pymdownx.superfences

  - toc:
      toc_depth: 4
repo_url: https://github.com/fullstaqd/architecture
repo_name: FullStaQD/architecture
edit_uri: edit/main/docs/
site_url: https://fullstaqd.github.io/architecture/

extra: 
  version:
    provider: mike

nav:
  - index.md
  - Reference Architecture:
    - reference-architecture/index.md
    - reference-architecture/01_introduction_and_goals.md
    - reference-architecture/02_architecture_constraints.md
    - reference-architecture/03_context_and_scope.md
    - reference-architecture/04_solution_strategy.md
    - reference-architecture/05_building_block_view.md
    - reference-architecture/06_runtime_view.md
    - reference-architecture/07_deployment_view.md
    - reference-architecture/08_concepts.md
    - reference-architecture/09_architecture_decisions.md
    - reference-architecture/10_quality_requirements.md
    - reference-architecture/11_technical_risks.md
    - reference-architecture/12_glossary.md
  - Scenario-Based Analysis:
    - scenario-based-analysis/index.md
    - scenario-based-analysis/material-simulation.md
    - scenario-based-analysis/cloud-optimisation.md
    - scenario-based-analysis/embedded.md
    - scenario-based-analysis/quantum-machine-learning.md
  - Reference Implementation:
    - reference-implementation/index.md
