# Adapted from https://github.com/squidfunk/mkdocs-material/discussions/4759#discussioncomment-4405468
name: Deploy dev version of the docs
on:
  push:
    branches:
      - main

permissions:
  contents: write # for writing to gh-pages branch

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Install project dependencies (incl. Python)
        run: uv sync --locked --all-extras --dev
      - name: Configure git username and email
        run: |
          git config --global user.name "FullStaQD Architecture Automation"
          git config --global user.email "no-reply@fullstaqd.de"
      - name: Build and deploy dev version
        run: uv run mike deploy --push dev
